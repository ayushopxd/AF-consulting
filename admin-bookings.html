<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Bookings | Ananya's Fusion</title>
    <link rel="icon" href="assets/ananyas-fusion-logo-clean.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin-bookings.css" />
  </head>
  <body class="admin-bookings-page">
    <main class="admin-shell">
      <a class="brand" href="/" aria-label="Ananya's Fusion home">
        <span class="brand-mark"><img src="assets/ananyas-fusion-logo-clean.png" alt="" /></span>
        <span>Ananya's Fusion</span>
      </a>
      <section class="admin-card" aria-labelledby="admin-title">
        <div class="admin-heading">
          <div>
            <span class="eyebrow">Private dashboard</span>
            <h1 id="admin-title">Bookings</h1>
            <p id="admin-summary" role="status">Checking access…</p>
          </div>
          <button id="refresh-bookings" class="button secondary" type="button" hidden>Refresh</button>
        </div>
        <div id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></div>
        <section id="admin-state" class="admin-state" aria-live="polite"></section>
        <section id="admin-dashboard" hidden>
          <div id="booking-filters" class="booking-filters" aria-label="Filter bookings"></div>
          <div id="bookings-list" class="bookings-list"></div>
        </section>
      </section>
    </main>
    <script type="module" src="admin-bookings.js"></script>
  </body>
</html>
