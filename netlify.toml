[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create-booking-order"
  to = "/.netlify/functions/create-booking-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-booking-payment"
  to = "/.netlify/functions/verify-booking-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-bookings"
  to = "/.netlify/functions/admin-bookings"
  status = 200
  force = true